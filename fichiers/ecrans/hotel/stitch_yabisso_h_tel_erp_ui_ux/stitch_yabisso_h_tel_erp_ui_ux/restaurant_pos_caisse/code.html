<h3 class="text-headline-md font-headline-md text-primary">Paiement Réussi</h3>
<p class="text-body-md text-on-surface-variant">La commande pour la Table 12 a été validée. Impression du reçu en cours...</p>
<button class="w-full bg-primary text-white py-md rounded-xl font-bold" onclick="closeModal()">Nouvelle Commande</button>
</div>
</div>
<script>
        let cart = [];

        function addToCart(name, price) {
            const existingItem = cart.find(item => item.name === name);
            if (existingItem) {
                existingItem.qty += 1;
            } else {
                cart.push({ name, price, qty: 1 });
            }
            renderCart();
            // Tactile feedback simulation
            const btn = event.currentTarget;
            btn.classList.add('ring-2', 'ring-secondary');
            setTimeout(() => btn.classList.remove('ring-2', 'ring-secondary'), 200);
        }

        function removeFromCart(index) {
            if (cart[index].qty > 1) {
                cart[index].qty -= 1;
            } else {
                cart.splice(index, 1);
            }
            renderCart();
        }

        function renderCart() {
            const container = document.getElementById('cart-items');
            const emptyMsg = document.getElementById('empty-cart-msg');
            const countLabel = document.getElementById('cart-count');
            
            if (cart.length === 0) {
                container.innerHTML = '';
                container.appendChild(emptyMsg);
                emptyMsg.classList.remove('hidden');
                countLabel.innerText = "0 articles";
            } else {
                emptyMsg.classList.add('hidden');
                container.innerHTML = '';
                cart.forEach((item, index) => {
                    const el = document.createElement('div');
                    el.className = "bg-surface border border-outline-variant p-sm rounded-xl flex items-center justify-between shadow-sm animate-in slide-in-from-right-4 duration-200";
                    el.innerHTML = `
                        <div class="flex flex-col">
                            <span class="text-label-lg font-bold">${item.name}</span>
                            <span class="text-label-sm text-on-surface-variant">${item.price.toLocaleString()} FCFA x ${item.qty}</span>
                        </div>
                        <div class="flex items-center gap-md">
                            <span class="font-bold text-primary">${(item.price * item.qty).toLocaleString()}</span>
                            <button onclick="removeFromCart(${index})" class="material-symbols-outlined text-error bg-error-container p-xs rounded-lg text-sm">remove</button>
                        </div>
                    `;
                    container.appendChild(el);
                });
                countLabel.innerText = `${cart.reduce((acc, i) => acc + i.qty, 0)} articles`;
            }

            updateTotals();
        }

        function updateTotals() {
            const sub = cart.reduce((acc, i) => acc + (i.price * i.qty), 0);
            const tax = Math.round(sub * 0.18);
            const total = sub + tax;

            document.getElementById('subtotal').innerText = `${sub.toLocaleString()} FCFA`;
            document.getElementById('tax').innerText = `${tax.toLocaleString()} FCFA`;
            document.getElementById('total').innerText = `${total.toLocaleString()} FCFA`;
        }

        function checkout() {
            if (cart.length === 0) return alert("Le panier est vide");
            document.getElementById('payment-success').classList.remove('hidden');
            document.getElementById('payment-success').classList.add('flex');
        }

        function closeModal() {
            cart = [];
            renderCart();
            document.getElementById('payment-success').classList.add('hidden');
            document.getElementById('payment-success').classList.remove('flex');
        }
    </script>
</body></html>
