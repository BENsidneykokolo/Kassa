name: yabisso_crm
description: Module CRM de l'écosystème Yabisso — contacts, pipeline commercial, interactions, relances.
version: 0.1.0
publish_to: 'none'

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter

  # --- Persistance locale offline-first ---
  drift: ^2.16.0
  sqlite3_flutter_libs: ^0.5.20
  path_provider: ^2.1.3
  path: ^1.9.0

  # --- État / DI ---
  flutter_riverpod: ^2.5.1

  # --- Utilitaires ---
  uuid: ^4.4.0
  intl: ^0.19.0
  collection: ^1.18.0

  # --- Pipeline kanban : implémenté avec Draggable/DragTarget natifs Flutter,
  # pas de dépendance tierce nécessaire (voir opportunity_pipeline_screen.dart).

  # --- Packages internes du monorepo Yabisso ---
  yabisso_ui:
    path: ../yabisso_ui
  yabisso_sync:
    path: ../yabisso_sync

dev_dependencies:
  flutter_test:
    sdk: flutter
  drift_dev: ^2.16.0
  build_runner: ^2.4.9

flutter:
  uses-material-design: true
