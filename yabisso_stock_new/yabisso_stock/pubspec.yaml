name: yabisso_stock
description: Module de gestion d'inventaire de l'écosystème Yabisso (multi-entrepôt, lots, péremption, recettes).
version: 0.1.0
publish_to: 'none'

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter

  # --- Persistance locale offline-first ---
  drift: ^2.16.0
  sqlite3_flutter_libs: ^0.5.20
  path_provider: ^2.1.3
  path: ^1.9.0

  # --- État / DI ---
  flutter_riverpod: ^2.5.1

  # --- Scan code-barres pour l'inventaire ---
  mobile_scanner: ^5.1.1

  # --- Utilitaires ---
  uuid: ^4.4.0
  intl: ^0.19.0
  collection: ^1.18.0

  # --- Packages internes du monorepo Yabisso (foundation partagée) ---
  # À remplacer par les chemins réels du monorepo une fois intégré dans Antigravity :
  yabisso_ui:
    path: ../yabisso_ui
  yabisso_catalog:
    path: ../yabisso_catalog        # catalogue produit partagé avec Kassa / LOBA
  yabisso_sync:
    path: ../yabisso_sync           # SDK générique de synchronisation au-dessus de YCE

dev_dependencies:
  flutter_test:
    sdk: flutter
  drift_dev: ^2.16.0
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0

flutter:
  uses-material-design: true
